<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><title>Câu 9</title><link rel="stylesheet" href="style.css"><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script></head>
<body><div class="container"><h1>Câu 9 - Form đăng ký</h1>
<form id="register">
<label>Họ tên *</label><input id="name" type="text"><br>
<label>Email *</label><input id="email" type="text"><br>
<label>Ngày sinh *</label><input id="birth" type="text" placeholder="mm/dd/yyyy"><br>

</form><div id="result" class="result"></div></div>
<script src="script.js"></script></body></html>
